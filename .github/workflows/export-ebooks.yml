name: Export Tipiṭaka Ebooks

# Tag format: <script>_<lang>, e.g. ro_si, ro_en, si_si, th_th, ro_my_nissaya
#   - script = Pali output script (ro, si, hi, th, ...)
#   - lang   = translation DB suffix (si, en, th, ... or my_nissaya)
# Push a tag like `ro_si` -> downloads epitaka.db + epitaka_si.db,
# exports ALL Mula books across parallel shard jobs, then zips per format
# and publishes:
#   1. immutable release for that tag (ro_si)
#   2. cumulative floating release `ebook-latest` (all languages, same filenames)
#
# Test without tagging via Actions > Run workflow (smoke test: one small book).

on:
  push:
    tags:
      - '*_*'   # e.g. ro_si, ro_en (script_lang); validated inside the job
  workflow_dispatch:
    inputs:
      script:
        description: 'Pali output script (ro, si, hi, th, lo, my, km, ...)'
        required: false
        default: 'ro'
        type: string
      language:
        description: 'Translation language code (e.g. en, si, th, my_nissaya). Empty = Pali only.'
        required: false
        default: 'si'
        type: string
      formats:
        description: 'Comma-separated output formats'
        required: false
        default: 'epub,pdf,md,docx'
        type: choice
        options:
          - 'epub,pdf,md,docx'
          - 'epub,pdf'
          - 'epub'
          - 'pdf'
      shards:
        description: 'Parallel shard jobs (more = faster, max ~10)'
        required: false
        default: '6'
        type: choice
        options:
          - '2'
          - '4'
          - '6'
          - '8'
          - '10'
      smoke_only:
        description: 'Smoke test only (export Dhp instead of --all)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  DB_BASE_URL: 'https://github.com/dhammanana/epitaka_app/releases/download/latest'

concurrency:
  group: ebook-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      script: ${{ steps.cfg.outputs.script }}
      lang: ${{ steps.cfg.outputs.lang }}
      tag: ${{ steps.cfg.outputs.tag }}
      formats: ${{ steps.cfg.outputs.formats }}
      shards: ${{ steps.cfg.outputs.shards }}
      smoke_only: ${{ steps.cfg.outputs.smoke_only }}
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - name: Resolve script / lang / tag
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCRIPT="${{ inputs.script }}"
            LANG="${{ inputs.language }}"
            FORMATS="${{ inputs.formats }}"
            SHARDS="${{ inputs.shards }}"
            SMOKE_ONLY="${{ inputs.smoke_only }}"
          else
            TAG="${GITHUB_REF_NAME}"
            # Split on FIRST underscore: script=prefix, lang=remainder
            # (supports variants like ro_my_nissaya -> lang=my_nissaya)
            SCRIPT="${TAG%%_*}"
            LANG="${TAG#*_}"
            FORMATS="epub,pdf,md,docx"
            SHARDS="6"
            SMOKE_ONLY="false"
          fi
          # Normalise
          SCRIPT="$(echo "$SCRIPT" | tr '[:upper:]' '[:lower:]' | xargs)"
          LANG="$(echo "$LANG" | tr '[:upper:]' '[:lower:]' | xargs)"
          FORMATS="$(echo "$FORMATS" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
          SHARDS="$(echo "$SHARDS" | tr -cd '0-9')"
          [ -z "$SCRIPT" ] && SCRIPT="ro"
          [ -z "$SHARDS" ] && SHARDS="6"
          TAG="${SCRIPT}_${LANG}"

          # Validate script (must match convert_pali.mjs scriptMap)
          case "$SCRIPT" in
            ro|si|hi|be|th|lo|my|km|gm|tt|gj|te|ka|mm|tb|cy|as|br) ;;
            *) echo "::error::Unknown script '$SCRIPT'. Tag must be <script>_<lang>, e.g. ro_si."; exit 1;;
          esac
          # Validate lang code shape (allow my_nissaya style variants)
          if [ -n "$LANG" ] && ! echo "$LANG" | grep -Eq '^[a-z]{2}(_[a-z]+)?$'; then
            echo "::error::Bad language '$LANG'. Tag must be <script>_<lang>, e.g. ro_si."
            exit 1
          fi
          # Validate formats subset of epub,pdf,md,docx
          if ! echo ",$FORMATS," | grep -Eq '^((,?(epub|pdf|md|docx))+),?$'; then
            echo "::error::Bad formats '$FORMATS'. Use subset of epub,pdf,md,docx."
            exit 1
          fi
          # Validate shard count 1-10
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 10 ]; then
            echo "::error::Shards must be 1-10, got '$SHARDS'."; exit 1
          fi

          # Build matrix JSON: {"shard":[0,1,...,N-1]}
          MATRIX="$(python3 -c "import json;print(json.dumps({'shard':list(range($SHARDS))}))")"

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "formats=$FORMATS" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "smoke_only=$SMOKE_ONLY" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG script=$SCRIPT lang=${LANG:-<pali-only>} formats=$FORMATS shards=$SHARDS smoke=$SMOKE_ONLY"

  smoke:
    name: Smoke test (Dhp)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web_server/scripts/export/requirements.txt

      - name: Setup Node.js (Pali script conversion)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_server/scripts/export/requirements.txt
          node --version
          python -c "import ebooklib, docx, PIL, fpdf; print('py deps ok')"

      - name: Download databases (core + translation)
        working-directory: web_server
        run: |
          set -euo pipefail
          LANG="${{ needs.setup.outputs.lang }}"
          mkdir -p data
          dl() { curl -fL --retry 3 --retry-delay 5 --show-error -o "$2" "$1"; }
          echo "Downloading core epitaka.db..."
          dl "${{ env.DB_BASE_URL }}/epitaka.zip" /tmp/epitaka.zip
          unzip -o -j /tmp/epitaka.zip '*.db' -d data/
          if [ -n "$LANG" ]; then
            echo "Downloading translation epitaka_${LANG}.db..."
            if ! dl "${{ env.DB_BASE_URL }}/epitaka_${LANG}.zip" "/tmp/epitaka_${LANG}.zip"; then
              echo "::error::No DB for language '$LANG' at ${{ env.DB_BASE_URL }}/epitaka_${LANG}.zip"
              exit 1
            fi
            unzip -o -j "/tmp/epitaka_${LANG}.zip" '*.db' -d data/
          fi
          ls -lh data/*.db
          for db in data/epitaka.db ${LANG:+data/epitaka_${LANG}.db}; do
            [ -f "$db" ] || { echo "::error::Missing $db after unzip"; ls -la data/; exit 1; }
            sqlite3 "$db" "PRAGMA integrity_check;" | grep -q '^ok$' \
              || { echo "::error::$db failed integrity check"; exit 1; }
          done
          echo "--- available translation languages ---"
          python -m scripts.export.cli --list-languages
          if [ -n "$LANG" ] && ! python -m scripts.export.cli --list-languages | grep -qw "$LANG"; then
            echo "::error::Language '$LANG' not found in downloaded DBs."
            exit 1
          fi

      - name: Smoke test (single small book)
        working-directory: web_server
        run: |
          set -euo pipefail
          python -m scripts.export.cli --book Dhp \
            --lang "${{ needs.setup.outputs.lang }}" \
            --script "${{ needs.setup.outputs.script }}" \
            --formats "${{ needs.setup.outputs.formats }}" \
            --output-dir ../ebook-output/smoke 2>&1 | tee /tmp/smoke.log
          test -n "$(find ../ebook-output/smoke -type f | head -1)" \
            || { echo "::error::Smoke test produced no files"; tail -50 /tmp/smoke.log; exit 1; }
          echo "Smoke test OK:"; find ../ebook-output/smoke -type f

  export:
    name: Export shard ${{ matrix.shard }}
    needs: [setup, smoke]
    if: needs.setup.outputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web_server/scripts/export/requirements.txt

      - name: Setup Node.js (Pali script conversion)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_server/scripts/export/requirements.txt

      - name: Download databases (core + translation)
        working-directory: web_server
        run: |
          set -euo pipefail
          LANG="${{ needs.setup.outputs.lang }}"
          mkdir -p data
          dl() { curl -fL --retry 3 --retry-delay 5 --show-error -o "$2" "$1"; }
          dl "${{ env.DB_BASE_URL }}/epitaka.zip" /tmp/epitaka.zip
          unzip -o -j /tmp/epitaka.zip '*.db' -d data/
          if [ -n "$LANG" ]; then
            dl "${{ env.DB_BASE_URL }}/epitaka_${LANG}.zip" "/tmp/epitaka_${LANG}.zip"
            unzip -o -j "/tmp/epitaka_${LANG}.zip" '*.db' -d data/
          fi
          df -h .

      - name: Export shard books
        working-directory: web_server
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          SHARDS="${{ needs.setup.outputs.shards }}"
          # Ordered full book list (same set as cli.py --all), strided across
          # shards: shard i takes every Nth book starting at i, so all
          # shards stay balanced (~equal count).
          BOOKS="$(python3 -c "
          import sqlite3
          conn = sqlite3.connect('data/epitaka.db')
          ids = [r[0] for r in conn.execute(\"SELECT book_id FROM books ORDER BY id\")]
          print(','.join(ids[$SHARD::$SHARDS]))
          ")"
          test -n "$BOOKS" || { echo "::error::Shard $SHARD got no books"; exit 1; }
          echo "Shard $SHARD/$SHARDS books: $BOOKS"
          python -m scripts.export.cli --book "$BOOKS" \
            --lang "${{ needs.setup.outputs.lang }}" \
            --script "${{ needs.setup.outputs.script }}" \
            --formats "${{ needs.setup.outputs.formats }}" \
            --output-dir ../shard-out 2>&1 | tee "/tmp/export-shard-${SHARD}.log"
          echo "--- shard file count / size ---"
          find ../shard-out -type f | wc -l
          du -sh ../shard-out

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ebooks-${{ needs.setup.outputs.tag }}-shard-${{ matrix.shard }}"
          path: shard-out/
          if-no-files-found: error
          retention-days: 3

      - name: Upload shard log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "export-log-${{ needs.setup.outputs.tag }}-shard-${{ matrix.shard }}-${{ github.run_id }}"
          path: /tmp/export-shard-*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Zip + release
    needs: [setup, export]
    if: needs.setup.outputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # create releases + upload assets
    steps:
      - name: Download all shard artifacts (merged)
        uses: actions/download-artifact@v4
        with:
          pattern: "ebooks-${{ needs.setup.outputs.tag }}-shard-*"
          path: "ebook-output/${{ needs.setup.outputs.tag }}"
          merge-multiple: true

      - name: Zip per format + checksums
        run: |
          set -euo pipefail
          TAG="${{ needs.setup.outputs.tag }}"
          SRC="ebook-output/$TAG"
          mkdir -p dist
          test -d "$SRC" || { echo "::error::Nothing exported in $SRC"; exit 1; }
          echo "Total files: $(find "$SRC" -type f | wc -l)"
          du -sh "$SRC"
          (cd "$SRC" && find . -type f -exec sha256sum {} + | sort -k2 > "../../dist/${TAG}-SHA256SUMS.txt")
          # One zip per top-level format dir (lang/format/... layout from cli.py);
          # fall back to a single zip if layout differs.
          if [ -d "$SRC/${{ needs.setup.outputs.lang }}" ]; then
            for fmt in $(echo "${{ needs.setup.outputs.formats }}" | tr ',' ' '); do
              D="$SRC/${{ needs.setup.outputs.lang }}/$fmt"
              [ -d "$D" ] || { echo "No output for format $fmt, skipping"; continue; }
              (cd "$SRC" && zip -qr "../../dist/${TAG}-${fmt}.zip" "${{ needs.setup.outputs.lang }}/$fmt")
            done
          else
            (cd "$SRC" && zip -qr "../../dist/${TAG}-all.zip" .)
          fi
          ls -lh dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          # GitHub rejects 0-byte release assets — fail here with a clear message
          for f in dist/*; do
            [ -s "$f" ] || { echo "::error::Empty file would break the release upload: $f"; exit 1; }
          done

      - name: Release for this tag (immutable)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: "Tipitaka Ebooks (${{ needs.setup.outputs.tag }})"
          body: |
            These ebooks are generated from the E-Piṭaka database ([epitaka.org](https://epitaka.org), Chaṭṭha Saṅgāyana Tipiṭaka).
            This pack (`${{ needs.setup.outputs.tag }}`) contains the complete Pāli canon text with the ${{ needs.setup.outputs.lang }} translation, Pāli in `${{ needs.setup.outputs.script }}` script.

            ### Download
            Pick your format — each zip holds the same books, only the file type differs:
            - `${{ needs.setup.outputs.tag }}-epub.zip` — for phones, tablets and e-readers
            - `${{ needs.setup.outputs.tag }}-pdf.zip` — for printing and computers
            - `${{ needs.setup.outputs.tag }}-docx.zip` — editable Word files
            - `${{ needs.setup.outputs.tag }}-md.zip` — plain text files

            ### All languages in one place
            Every language pack is also collected in the [`ebook-latest`](https://github.com/${{ github.repository }}/releases/tag/ebook-latest) release, so you can find all books and all languages there.

            Pāli text is in the public domain. Translations are shared under CC-BY-4.0.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Copy to floating ebook-latest release (cumulative)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ebook-latest
          name: "Tipitaka Ebooks (latest)"
          body: |
            All E-Piṭaka ebook language packs in one place. Each pack is generated from the E-Piṭaka database ([epitaka.org](https://epitaka.org), Chaṭṭha Saṅgāyana Tipiṭaka) and contains the complete Pāli canon text with its translation.
            Packs are kept separate per language (`ro_si-epub.zip`, `ro_en-pdf.zip`, …) so you only download the language you need, instead of one giant file with everything.

            Pāli text is in the public domain. Translations are shared under CC-BY-4.0.
          files: dist/*
          fail_on_unmatched_files: true
          preserve_assets: true
          draft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "ebooks-${{ needs.setup.outputs.tag }}-${{ github.run_id }}"
          path: dist/*
          if-no-files-found: error
          retention-days: 7
