name: Export Tipiṭaka Ebooks

# Tag format: <script>_<lang>, e.g. ro_si, ro_en, si_si, th_th, ro_my_nissaya
#   - script = Pali output script (ro, si, hi, th, ...)
#   - lang   = translation DB suffix (si, en, th, ... or my_nissaya)
# Push a tag like `ro_si` -> exports ALL Mula books across parallel shard
# jobs, then zips per format and publishes:
#   1. immutable release for that tag (ro_si)
#   2. cumulative floating release `ebook-latest` (all languages)
#
# All logic lives in web_server/scripts/export/ci.py + metadata.py so it
# can be tested locally without waiting for CI:
#   python -m scripts.export.ci describe --tag si_si
#   python -m scripts.export.ci resolve --tag ro_si --formats epub,pdf
#
# Test without tagging via Actions > Run workflow (smoke test: one small book).

on:
  push:
    tags:
      - '*_*'   # e.g. ro_si, ro_en (script_lang); validated in ci.py
  workflow_dispatch:
    inputs:
      script:
        description: 'Pali output script (ro, si, hi, th, lo, my, km, ...)'
        required: false
        default: 'ro'
        type: string
      language:
        description: 'Translation language code (e.g. en, si, th, my_nissaya). Empty = Pali only.'
        required: false
        default: 'si'
        type: string
      formats:
        description: 'Comma-separated output formats'
        required: false
        default: 'epub,pdf,md,docx'
        type: choice
        options:
          - 'epub,pdf,md,docx'
          - 'epub,pdf'
          - 'epub'
          - 'pdf'
      shards:
        description: 'Parallel shard jobs (more = faster, max ~10)'
        required: false
        default: '6'
        type: choice
        options:
          - '2'
          - '4'
          - '6'
          - '8'
          - '10'
      smoke_only:
        description: 'Smoke test only (export Dhp instead of --all)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  DB_BASE_URL: 'https://github.com/dhammanana/epitaka_app/releases/download/latest'

concurrency:
  group: ebook-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      script: ${{ steps.cfg.outputs.script }}
      lang: ${{ steps.cfg.outputs.lang }}
      tag: ${{ steps.cfg.outputs.tag }}
      formats: ${{ steps.cfg.outputs.formats }}
      shards: ${{ steps.cfg.outputs.shards }}
      smoke_only: ${{ steps.cfg.outputs.smoke_only }}
      matrix: ${{ steps.cfg.outputs.matrix }}
      pack_label: ${{ steps.cfg.outputs.pack_label }}
      release_title: ${{ steps.cfg.outputs.release_title }}
      release_body: ${{ steps.cfg.outputs.release_body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve script / lang / tag (ci.py)
        id: cfg
        run: |
          PYTHONPATH=web_server python3 -m scripts.export.ci resolve \
            --event "${{ github.event_name }}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --script "${{ inputs.script }}" \
            --language "${{ inputs.language }}" \
            --formats "${{ inputs.formats }}" \
            --shards "${{ inputs.shards }}" \
            --smoke-only "${{ inputs.smoke_only }}" \
            --github-output "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (Dhp)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web_server/scripts/export/requirements.txt

      - name: Setup Node.js (Pali script conversion)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_server/scripts/export/requirements.txt
          node --version

      - name: Download databases (core + translation)
        working-directory: web_server
        run: |
          python -m scripts.export.ci fetch-dbs \
            --data-dir data \
            --lang "${{ needs.setup.outputs.lang }}" \
            --db-base-url "${{ env.DB_BASE_URL }}"

      - name: Smoke test (single small book)
        working-directory: web_server
        run: |
          set -euo pipefail
          python -m scripts.export.cli --book Dhp \
            --lang "${{ needs.setup.outputs.lang }}" \
            --script "${{ needs.setup.outputs.script }}" \
            --formats "${{ needs.setup.outputs.formats }}" \
            --output-dir ../ebook-output/smoke 2>&1 | tee /tmp/smoke.log
          test -n "$(find ../ebook-output/smoke -type f | head -1)" \
            || { echo "::error::Smoke test produced no files"; tail -50 /tmp/smoke.log; exit 1; }
          echo "Smoke test OK:"; find ../ebook-output/smoke -type f

  export:
    name: Export shard ${{ matrix.shard }}
    needs: [setup, smoke]
    if: needs.setup.outputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web_server/scripts/export/requirements.txt

      - name: Setup Node.js (Pali script conversion)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_server/scripts/export/requirements.txt

      - name: Download databases (core + translation)
        working-directory: web_server
        run: |
          python -m scripts.export.ci fetch-dbs \
            --data-dir data \
            --lang "${{ needs.setup.outputs.lang }}" \
            --db-base-url "${{ env.DB_BASE_URL }}"

      - name: Export shard books
        working-directory: web_server
        run: |
          set -euo pipefail
          BOOKS="$(python -m scripts.export.ci shard-books \
            --data-dir data \
            --shard "${{ matrix.shard }}" \
            --shards "${{ needs.setup.outputs.shards }}")"
          test -n "$BOOKS" || { echo "::error::Shard ${{ matrix.shard }} got no books"; exit 1; }
          echo "Shard ${{ matrix.shard }}/${{ needs.setup.outputs.shards }} books: $BOOKS"
          python -m scripts.export.cli --book "$BOOKS" \
            --lang "${{ needs.setup.outputs.lang }}" \
            --script "${{ needs.setup.outputs.script }}" \
            --formats "${{ needs.setup.outputs.formats }}" \
            --output-dir ../shard-out 2>&1 | tee "/tmp/export-shard-${{ matrix.shard }}.log"
          echo "--- shard file count / size ---"
          find ../shard-out -type f | wc -l
          du -sh ../shard-out

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ebooks-${{ needs.setup.outputs.tag }}-shard-${{ matrix.shard }}"
          path: shard-out/
          if-no-files-found: error
          retention-days: 3

      - name: Upload shard log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "export-log-${{ needs.setup.outputs.tag }}-shard-${{ matrix.shard }}-${{ github.run_id }}"
          path: /tmp/export-shard-*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Zip + release
    needs: [setup, export]
    if: needs.setup.outputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # create releases + upload assets
    steps:
      - name: Download all shard artifacts (merged)
        uses: actions/download-artifact@v4
        with:
          pattern: "ebooks-${{ needs.setup.outputs.tag }}-shard-*"
          path: "ebook-output/${{ needs.setup.outputs.tag }}"
          merge-multiple: true

      - name: Zip per format + checksums (ci.py)
        run: |
          PYTHONPATH=web_server python3 -m scripts.export.ci package \
            --src "ebook-output/${{ needs.setup.outputs.tag }}" \
            --dist dist \
            --tag "${{ needs.setup.outputs.tag }}" \
            --lang "${{ needs.setup.outputs.lang }}" \
            --formats "${{ needs.setup.outputs.formats }}"
          ls -lh dist/

      - name: Release for this tag (immutable)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.release_title }}
          body: |
            ${{ needs.setup.outputs.release_body }}

            ### Download
            Pick your format — each zip holds the same books, only the file type differs:
            - `${{ needs.setup.outputs.tag }}-epub.zip` — for phones, tablets and e-readers
            - `${{ needs.setup.outputs.tag }}-pdf.zip` — for printing and computers
            - `${{ needs.setup.outputs.tag }}-docx.zip` — editable Word files
            - `${{ needs.setup.outputs.tag }}-md.zip` — plain text files

            ### All languages in one place
            Every language pack is also collected in the [`ebook-latest`](https://github.com/${{ github.repository }}/releases/tag/ebook-latest) release, so you can find all books and all languages there.

            Pāli text is in the public domain. Translations are shared under CC-BY-4.0.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Copy to floating ebook-latest release (cumulative)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ebook-latest
          name: "Tipitaka Ebooks (latest)"
          body: |
            All E-Piṭaka ebook language packs in one place. Each pack is generated from the E-Piṭaka database ([epitaka.org](https://epitaka.org), Chaṭṭha Saṅgāyana Tipiṭaka) and contains the complete Pāli canon text with its translation.
            Packs are kept separate per language (`ro_si-epub.zip`, `ro_en-pdf.zip`, …) so you only download the language you need, instead of one giant file with everything.

            Pāli text is in the public domain. Translations are shared under CC-BY-4.0.
          files: dist/*
          fail_on_unmatched_files: true
          preserve_assets: true
          draft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "ebooks-${{ needs.setup.outputs.tag }}-${{ github.run_id }}"
          path: dist/*
          if-no-files-found: error
          retention-days: 7
