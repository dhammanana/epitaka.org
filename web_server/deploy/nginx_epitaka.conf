# nginx config for epitaka.org (aaPanel-compatible)
# ---------------------------------------------------------------------
# aaPanel manages /www/server/panel/vhost/nginx/<domain>.conf itself and may
# overwrite it. Two ways to use this:
#
#   A) aaPanel → Website → epitaka.org → 反向代理 (Reverse proxy):
#      set target http://127.0.0.1:8080  (aaPanel writes the proxy blocks).
#      Then add the custom bits below via the 配置文件 (config file) editor.
#
#   B) Drop this file at /www/server/panel/vhost/nginx/epitaka.org.conf
#      (back up the existing one first), adjust the server_name and paths.
#
# The important parts are: static files served by nginx (not gunicorn),
# gzip, long asset expiry, proxy timeouts that match gunicorn, and
# per-IP rate limits on the expensive /api endpoints as defense-in-depth
# behind Cloudflare.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name epitaka.org www.epitaka.org;

    # nginx only needs HTTP if Cloudflare handles TLS; keep both harmless.
    listen 443 ssl http2;
    # aaPanel normally fills these in (SSL tab) — keep them or let aaPanel
    # manage them:
    # ssl_certificate     /www/server/panel/vhost/cert/epitaka.org/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/epitaka.org/privkey.pem;

    client_max_body_size 1m;

    # ---- Force HTTPS at the origin ---------------------------------
    # Cloudflare forwards the visitor's real scheme in X-Forwarded-Proto, so
    # this redirects only the people who actually arrived over http://. A
    # plain HTTP request straight to the origin (no Cloudflare header, e.g.
    # a health check) is still served — the old "keep both harmless"
    # behaviour — and a Cloudflare setup that talks to the origin over HTTP
    # (Flexible SSL) cannot loop, because it always reports "https".
    # Cloudflare → SSL/TLS → Edge Certificates → "Always Use HTTPS" is the
    # primary switch; this is the origin-side backstop.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ---- gzip (static + JSON) -------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf application/wasm;

    # ---- Serve built frontend assets straight from disk -------------
    # Path on the server (adjust to your deploy location):
    #   /home/deploy/apps/epitaka/web_server/frontend/dist
    location /static/ {
        alias /home/deploy/apps/epitaka/web_server/frontend/dist/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ---- Verification / root files (no proxy overhead) -------------
    location ~ ^/google[0-9a-f]+\.html$ {
        root /home/deploy/apps/epitaka/web_server/root_files;
        expires 1d;
    }
    location = /robots.txt {
        root /home/deploy/apps/epitaka/web_server/root_files;  # or proxy below
        expires 1d;
        access_log off;
    }

    # ---- Expensive public APIs: rate limit per IP -------------------
    # Generous for real users (Cloudflare does the real bot filtering);
    # this just stops direct-to-origin abuse.
    location ~ ^/api/(fts_search|suggest_word|bold_definition|bold_suggest|dictionary|search_headings) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /www/server/nginx/conf/proxy.conf;   # aaPanel default proxy include
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        # Always "https": the public origin is HTTPS-only, and Flask builds
        # its canonical/OG/hreflang URLs from this header. Forwarding $scheme
        # would let a Cloudflare→origin HTTP (Flexible SSL) hop make every
        # canonical URL http:// — the mismatch the audit caught.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;   # ≥ gunicorn --timeout + margin
        proxy_send_timeout    35s;
    }

    # ---- Everything else → gunicorn ---------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /www/server/nginx/conf/proxy.conf;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;   # see the note above
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;

        # ---- Security headers --------------------------------------
        # Verified missing on live responses (2026-10-08 audit). `always`
        # keeps them on 4xx/5xx too. HSTS without includeSubDomains/preload:
        # add those once every subdomain is HTTPS-only. A Content-Security-
        # Policy is deliberately NOT set here — the pages use inline scripts,
        # Google Fonts, GA and Firebase, so a policy needs its own audit and a
        # report-only rollout first.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    }
}
